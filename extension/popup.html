<!doctype html>
<html><head><meta charset="utf-8">
<style>
body{font:14px -apple-system,system-ui,sans-serif;width:300px;margin:0;padding:18px;background:#0f1115;color:#e9ecf2}
h1{font-size:16px;margin:0 0 8px}p{color:#aab1c0;margin:0 0 12px;line-height:1.4}
input{width:100%;box-sizing:border-box;padding:10px;border-radius:10px;border:1px solid #2c313c;background:#1a1d24;color:#e9ecf2;font-size:18px;letter-spacing:4px;text-align:center;margin-bottom:10px}
button{width:100%;padding:10px;border-radius:10px;border:0;background:#7c9cff;color:#0f1115;font-weight:600;cursor:pointer;margin-bottom:8px}
button.ghost{background:#1a1d24;color:#e9ecf2;border:1px solid #2c313c;font-weight:400}
.err{color:#ff8a8a}
</style></head>
<body>
<h1>Ozlon Browser</h1>
<div id="paired" hidden>
  <p>Connected. Ask Ozlon to do a job and it will run here.</p>
  <p id="status"></p>
  <button class="ghost" id="reset">Reset saved permissions</button>
  <button class="ghost" id="unpair">Disconnect</button>
</div>
<div id="unpaired" hidden>
  <p>Open Ozlon, go to Settings, then Browser, and tap "Connect Chrome" to get a code.</p>
  <input id="code" maxlength="6" placeholder="000000" inputmode="numeric">
  <button id="pair">Connect</button>
  <p id="err" class="err"></p>
</div>
<script src="popup.js"></script>
</body></html>
