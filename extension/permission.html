<!doctype html>
<html><head><meta charset="utf-8"><title>Ozlon wants permission</title>
<style>
body{font:14px -apple-system,system-ui,sans-serif;margin:0;padding:22px;background:#0f1115;color:#e9ecf2}
h1{font-size:16px;margin:0 0 10px}p{color:#aab1c0;line-height:1.45;margin:0 0 14px}
.box{background:#1a1d24;border-radius:12px;padding:12px;margin-bottom:16px;word-break:break-word}
button{display:block;width:100%;padding:11px;margin-bottom:8px;border-radius:10px;border:1px solid #2c313c;background:#1a1d24;color:#e9ecf2;font-size:14px;cursor:pointer}
button.primary{background:#7c9cff;border-color:#7c9cff;color:#0f1115;font-weight:600}
</style></head>
<body>
<h1 id="title"></h1><p id="sub"></p><div class="box" id="detail"></div>
<button class="primary" data-a="once">Allow once</button>
<button data-a="site" id="site">Always allow on this site</button>
<button data-a="all" id="all">Always allow everything</button>
<button data-a="deny">Don't allow</button>
<script src="permission.js"></script>
</body></html>
